name: QingLi
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
packages:
  LunarCore:
    url: https://github.com/wbx1-Ltd/LunarCore-Swift.git
    exactVersion: "1.2.0"
targets:
  QingLiCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/QingLiCore
        excludes:
          - Resources
    dependencies:
      - package: LunarCore
        product: LunarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingli.core
        PRODUCT_NAME: QingLiCore
  QingLi:
    type: application
    platform: macOS
    sources:
      - path: Sources/QingLi
        excludes:
          - Info.plist
      - path: Sources/QingLiCore/Resources
        buildPhase: resources
    info:
      path: Sources/QingLi/Info.plist
      properties:
        CFBundleDisplayName: 清历
        CFBundleName: 清历
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        LSUIElement: true
    dependencies:
      - target: QingLiCore
      - package: LunarCore
        product: LunarCore
      - target: QingLiWidgetExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingli.app
        PRODUCT_NAME: QingLi
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/QingLi/QingLi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  QingLiWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QingLiWidgetExtension
        excludes:
          - Info.plist
      - path: Sources/QingLiCore/Resources
        buildPhase: resources
    info:
      path: Sources/QingLiWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: 清历
        CFBundleName: 清历
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - target: QingLiCore
      - package: LunarCore
        product: LunarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingli.app.widget
        PRODUCT_NAME: QingLiWidgetExtension
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/QingLiWidgetExtension/QingLiWidgetExtension.entitlements
  QingLiCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QingLiCoreTests
        excludes:
          - Info.plist
      - path: Sources/QingLiCore/Resources
        buildPhase: resources
    info:
      path: Tests/QingLiCoreTests/Info.plist
    dependencies:
      - target: QingLiCore
      - package: LunarCore
        product: LunarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingli.tests
  QingLiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QingLiTests
        excludes:
          - Info.plist
    info:
      path: Tests/QingLiTests/Info.plist
    dependencies:
      - target: QingLi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingli.app-tests
schemes:
  QingLi:
    build:
      targets:
        QingLi: all
        QingLiWidgetExtension: all
    test:
      targets:
        - QingLiCoreTests
        - QingLiTests
